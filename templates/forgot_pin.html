{% extends "base.html" %}
{% block title %}Reset Password — Budget Tracker{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">🔐</div>
        <h1 class="auth-title">Reset Your Password</h1>
        <p class="auth-subtitle">Use your recovery code to set a new password</p>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/forgot-pin" class="auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="security_answer">Recovery code</label>
                <input type="text" id="security_answer" name="security_answer" placeholder="32-character recovery code" required>
            </div>
            <div class="form-group">
                <label for="new_pin">New Password</label>
                <input type="password" id="new_pin" name="new_pin" minlength="12" maxlength="128" autocomplete="new-password"
                       placeholder="At least 12 characters" required>
            </div>
            <div class="form-group">
                <label for="confirm_pin">Confirm New Password</label>
                <input type="password" id="confirm_pin" name="confirm_pin" minlength="12" maxlength="128" autocomplete="new-password"
                       placeholder="Re-enter Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
        </form>

        <p class="auth-switch"><a href="/login">Back to Sign In</a></p>
    </div>
</div>
{% endblock %}
