{% extends "base.html" %}
{% block title %}Register — Budget Tracker{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">💰</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Start tracking your finances today</p>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register" class="auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
            </div>
            <div class="form-group">
                <label for="pin">PIN</label>
                <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password"
                       placeholder="4-digit PIN" required>
                <small style="color:var(--text-secondary,#888);">Choose a 4-digit PIN you'll remember</small>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Sign in here</a></p>
    </div>
</div>
{% endblock %}
